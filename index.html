<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillMatch - Nền tảng ghép đội cho sinh viên</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&family=Be+Vietnam+Pro:wght@400;600;700;800&subset=vietnamese&display=swap" rel="stylesheet">

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone (để chạy JSX trực tiếp trên trình duyệt) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F4FAF8;
      color: #223338;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // Khởi tạo Supabase client (nếu có URL & KEY từ file supabaseClient.ts của bạn, hãy thay vào 2 chuỗi bên dưới)
    const SUPABASE_URL = "https://your-supabase-project.supabase.co";
    const SUPABASE_ANON_KEY = "your-anon-key";
    const supabase = (window.supabase && window.supabase.createClient) 
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : {
          auth: {
            getUser: async () => ({ data: { user: null } }),
            onAuthStateChange: () => ({ data: { subscription: { unsubscribe: () => {} } } }),
            signInWithPassword: async () => ({ data: {}, error: null }),
            signUp: async () => ({ data: {}, error: null }),
            signOut: async () => {},
          },
          from: () => ({
            select: () => ({ or: () => ({ order: async () => ({ data: [] }) }), not: () => Promise.resolve({ data: [] }), in: () => Promise.resolve({ data: [] }), eq: () => ({ single: async () => ({ data: null }) }) }),
            insert: async () => ({ error: null }),
            upsert: async () => ({ error: null }),
          }),
          channel: () => ({ on: () => ({ subscribe: () => {} }) }),
          removeChannel: () => {},
          storage: { from: () => ({ upload: async () => ({ error: null }), getPublicUrl: () => ({ data: { publicUrl: '' } }) }) }
        };

    // Bộ icons SVG thay thế cho lucide-react
    const Heart = ({ size = 24, fill = "none", color = "currentColor" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
    );
    const X = ({ size = 24, color = "currentColor" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    );
    const Camera = ({ size = 24, color = "currentColor" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
    );
    const Send = ({ size = 24, color = "currentColor" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
    );
    const LogOut = ({ size = 24, color = "currentColor" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
    );
    const User = ({ size = 24, color = "currentColor" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    );
    const MessageCircle = ({ size = 24, color = "currentColor" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
    );
    const Users = ({ size = 24, color = "currentColor" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    );
    const Home = ({ size = 24, color = "currentColor" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    );

    const PROFILES = [
      { id: 1, name: 'Trần Hoàng Nam', major: 'Khoa học máy tính', have: ['Code Python'], want: ['UI/UX Design'], goal: 'Thi Hackathon 2024', color: '#3FA796' },
      { id: 2, name: 'Lê Ngọc Hân', major: 'Thiết kế Đồ họa', have: ['UI/UX', 'Figma'], want: ['Lập trình Web'], goal: 'Thi Hackathon 2024', color: '#5B8DEF' },
      { id: 3, name: 'Nguyễn Minh Trí', major: 'Phân tích Dữ liệu', have: ['Xử lý số liệu', 'Power BI'], want: ['Thuyết trình', 'Làm Slide'], goal: 'Bài tập Kinh tế lượng', color: '#B08A3E' },
      { id: 4, name: 'Phạm Yến Nhi', major: 'Quan hệ Công chúng', have: ['Thuyết trình', 'Hoạt ngôn'], want: ['Xử lý số liệu', 'Data'], goal: 'Bài tập Kinh tế lượng', color: '#A85CC1' },
      { id: 5, name: 'Vũ Hải Đăng', major: 'Truyền thông Đa phương tiện', have: ['Edit Video', 'Quay phim'], want: ['Viết kịch bản', 'Ý tưởng'], goal: 'Đồ án Sản xuất Video', color: '#3FA796' },
      { id: 6, name: 'Đặng Mai Phương', major: 'Báo chí', have: ['Content Creator', 'Copywriting'], want: ['Quay dựng Video'], goal: 'Đồ án Sản xuất Video', color: '#5B8DEF' },
      { id: 7, name: 'Đinh Văn Khoa', major: 'Quản trị Kinh doanh', have: ['Lập kế hoạch', 'Leader'], want: ['Chạy Ads', 'Marketing'], goal: 'Khởi nghiệp Sinh viên', color: '#B08A3E' },
      { id: 8, name: 'Lý Thảo My', major: 'Digital Marketing', have: ['Chạy Ads', 'SEO'], want: ['Lãnh đạo', 'Lên ý tưởng'], goal: 'Khởi nghiệp Sinh viên', color: '#A85CC1' },
      { id: 9, name: 'Bùi Quang Huy', major: 'Tài chính Ngân hàng', have: ['Lập mô hình tài chính'], want: ['Thiết kế Pitch Deck'], goal: 'Giải quyết Business Case', color: '#3FA796' },
      { id: 10, name: 'Ngô Thùy Linh', major: 'Thiết kế Mỹ thuật số', have: ['Thiết kế Slide đỉnh cao'], want: ['Tính toán tài chính'], goal: 'Giải quyết Business Case', color: '#5B8DEF' },
    ];

    function initials(name) {
      if (!name) return 'U';
      const parts = name.trim().split(' ');
      return ((parts[parts.length - 2]?.[0] || '') + (parts[parts.length - 1]?.[0] || ''));
    }

    function Avatar({ name, color, size = 64, src }) {
      if (src) {
        return (
          <img src={src} alt={name} style={{ width: size, height: size, borderRadius: '9999px', objectFit: 'cover', border: '3px solid #fff', boxShadow: '0 2px 10px rgba(34,51,56,0.12)' }} />
        );
      }
      return (
        <div style={{ width: size, height: size, borderRadius: '9999px', background: color || '#3FA796', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontFamily: 'Sora, sans-serif', fontWeight: 700, fontSize: size * 0.34, border: '3px solid #fff', boxShadow: '0 2px 10px rgba(34,51,56,0.12)', flexShrink: 0 }}>
          {initials(name).toUpperCase()}
        </div>
      );
    }

    function Tag({ children, tone }) {
      const tones = {
        have: { bg: '#DFF3EE', fg: '#1F7A67' },
        want: { bg: '#E5ECFB', fg: '#2C4A99' },
        goal: { bg: '#F1E8FB', fg: '#6B3FA0' },
      };
      const t = tones[tone] || tones.have;
      return (
        <span style={{ background: t.bg, color: t.fg, fontSize: 12.5, fontWeight: 600, padding: '5px 10px', borderRadius: 999, display: 'inline-block', marginRight: 6, marginBottom: 6 }}>
          {children}
        </span>
      );
    }

    function Header({ page, setPage, isLoggedIn, currentUser, onLogout, onLoginClick }) {
      const navItems = [
        { key: 'landing', label: 'Trang chủ', icon: Home },
        { key: 'swipe', label: 'Ghép đội', icon: Users },
        { key: 'chat', label: 'Nhắn tin', icon: MessageCircle },
        { key: 'profile', label: 'Trang cá nhân', icon: User },
      ];
      return (
        <div style={{ position: 'sticky', top: 0, zIndex: 30, background: 'rgba(244,250,248,0.9)', backdropFilter: 'blur(8px)', borderBottom: '1px solid #DCEAE6' }}>
          <div style={{ maxWidth: 1040, margin: '0 auto', padding: '14px 24px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <div onClick={() => setPage('landing')} style={{ fontFamily: 'Sora, sans-serif', fontWeight: 800, fontSize: 20, color: '#223338', cursor: 'pointer', letterSpacing: -0.3 }}>
              SkillMatch
            </div>
            {isLoggedIn && (
              <nav style={{ display: 'flex', gap: 4 }}>
                {navItems.map((item) => {
                  const Icon = item.icon;
                  const active = page === item.key;
                  return (
                    <button key={item.key} onClick={() => setPage(item.key)} style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '8px 14px', borderRadius: 999, fontSize: 14, fontWeight: 600, border: 'none', cursor: 'pointer', background: active ? '#DFF3EE' : 'transparent', color: active ? '#1F7A67' : '#6B8087', transition: 'background 0.15s ease' }}>
                      <Icon size={16} />
                      {item.label}
                    </button>
                  );
                })}
              </nav>
            )}
            {isLoggedIn ? (
              <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                <Avatar name={currentUser.name} color={currentUser.color} size={34} src={currentUser.avatarUrl} />
                <span style={{ fontSize: 14, fontWeight: 600, color: '#223338' }}>{currentUser.name}</span>
                <button onClick={onLogout} title="Đăng xuất" style={{ display: 'flex', alignItems: 'center', gap: 4, background: '#FBEAE8', color: '#E2574C', border: 'none', padding: '8px 12px', borderRadius: 999, fontSize: 13, fontWeight: 600, cursor: 'pointer' }}>
                  <LogOut size={14} /> Đăng xuất
                </button>
              </div>
            ) : (
              <button onClick={onLoginClick} style={{ background: '#3FA796', color: '#fff', border: 'none', padding: '9px 18px', borderRadius: 999, fontSize: 14, fontWeight: 700, cursor: 'pointer' }}>
                Đăng nhập
              </button>
            )}
          </div>
        </div>
      );
    }

    function Landing({ onCtaClick }) {
      return (
        <div style={{ maxWidth: 720, margin: '0 auto', padding: '96px 24px 64px', textAlign: 'center' }}>
          <div style={{ display: 'inline-block', background: '#DFF3EE', color: '#1F7A67', fontSize: 13, fontWeight: 600, padding: '6px 14px', borderRadius: 999, marginBottom: 24 }}>
            Nền tảng ghép đội cho sinh viên
          </div>
          <h1 style={{ fontFamily: 'Be Vietnam Pro, sans-serif', fontWeight: 800, fontSize: 'clamp(32px, 5vw, 52px)', lineHeight: 1.15, color: '#223338', letterSpacing: -0.5, margin: '0 0 20px' }}>
            Tìm mảnh ghép hoàn hảo cho dự án
          </h1>
          <p style={{ fontFamily: 'Be Vietnam Pro, sans-serif', fontSize: 17, color: '#6B8087', lineHeight: 1.6, maxWidth: 480, margin: '0 auto 40px' }}>
            Kết nối dựa trên kỹ năng thực chiến. Quẹt để tìm đồng đội chạy deadline ngay hôm nay!
          </p>
          <button onClick={onCtaClick} style={{ fontFamily: 'Be Vietnam Pro, sans-serif', background: '#3FA796', color: '#fff', border: 'none', padding: '16px 36px', borderRadius: 999, fontSize: 16, fontWeight: 700, cursor: 'pointer', boxShadow: '0 8px 24px rgba(63,167,150,0.35)' }}>
            Bắt đầu ghép đội
          </button>
          <div style={{ marginTop: 80, display: 'flex', justifyContent: 'center' }}>
            {PROFILES.slice(0, 5).map((p, i) => (
              <div key={p.id} style={{ marginLeft: i === 0 ? 0 : -14 }}>
                <Avatar name={p.name} color={p.color} size={48} />
              </div>
            ))}
          </div>
          <p style={{ fontSize: 13, color: '#9AACAF', marginTop: 12 }}>Hơn 10 sinh viên đang tìm đồng đội</p>
        </div>
      );
    }

    function SwipeCard({ profile, dragX, isTop, onPointerDown }) {
      const rotate = isTop ? dragX / 18 : 0;
      const likeOpacity = Math.max(0, Math.min(1, dragX / 90));
      const nopeOpacity = Math.max(0, Math.min(1, -dragX / 90));
      return (
        <div onPointerDown={isTop ? onPointerDown : undefined} style={{ position: 'absolute', inset: 0, background: '#fff', borderRadius: 28, boxShadow: isTop ? '0 20px 50px rgba(34,51,56,0.18)' : '0 8px 20px rgba(34,51,56,0.08)', transform: `translateX(${isTop ? dragX : 0}px) rotate(${rotate}deg) scale(${isTop ? 1 : 0.96})`, transition: dragX === 0 ? 'transform 0.35s cubic-bezier(.2,.8,.2,1)' : 'none', display: 'flex', flexDirection: 'column', overflow: 'hidden', touchAction: 'pan-y', cursor: isTop ? 'grab' : 'default', userSelect: 'none' }}>
          {isTop && (
            <>
              <div style={{ position: 'absolute', top: 28, left: 24, border: '3px solid #3FA796', color: '#3FA796', fontWeight: 800, fontFamily: 'Sora, sans-serif', fontSize: 22, padding: '2px 12px', borderRadius: 10, opacity: likeOpacity, transform: 'rotate(-12deg)', zIndex: 10 }}>THÍCH</div>
              <div style={{ position: 'absolute', top: 28, right: 24, border: '3px solid #E2574C', color: '#E2574C', fontWeight: 800, fontFamily: 'Sora, sans-serif', fontSize: 22, padding: '2px 12px', borderRadius: 10, opacity: nopeOpacity, transform: 'rotate(12deg)', zIndex: 10 }}>BỎ QUA</div>
            </>
          )}
          <div style={{ background: `linear-gradient(160deg, ${profile.color}22, #F4FAF8)`, padding: '36px 0 24px', display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
            <Avatar name={profile.name} color={profile.color} size={96} />
            <h3 style={{ fontFamily: 'Sora, sans-serif', fontWeight: 700, fontSize: 22, color: '#223338', margin: '16px 0 2px' }}>{profile.name}</h3>
            <p style={{ fontSize: 14, color: '#6B8087', margin: 0 }}>{profile.major}</p>
          </div>
          <div style={{ padding: '20px 24px', flex: 1, overflowY: 'auto' }}>
            <div style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: '#9AACAF', marginBottom: 6 }}>Kỹ năng đang có</div>
              {profile.have && profile.have.map((s) => <Tag tone="have" key={s}>{s}</Tag>)}
            </div>
            <div style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: '#9AACAF', marginBottom: 6 }}>Kỹ năng tìm kiếm</div>
              {profile.want && profile.want.map((s) => <Tag tone="want" key={s}>{s}</Tag>)}
            </div>
            <div>
              <div style={{ fontSize: 12, fontWeight: 700, color: '#9AACAF', marginBottom: 6 }}>Mục tiêu / Dự án</div>
              <Tag tone="goal">{profile.goal}</Tag>
            </div>
          </div>
        </div>
      );
    }

    function SwipePage({ deck, onSwipe, onReset }) {
      const [dragX, setDragX] = useState(0);
      const dragging = useRef(false);
      const startX = useRef(0);

      function pointerDown(e) {
        dragging.current = true;
        startX.current = e.clientX;
      }
      function pointerMove(e) {
        if (!dragging.current) return;
        setDragX(e.clientX - startX.current);
      }
      function pointerUp() {
        if (!dragging.current) return;
        dragging.current = false;
        if (dragX > 90) fireSwipe('right');
        else if (dragX < -90) fireSwipe('left');
        else setDragX(0);
      }
      function fireSwipe(dir) {
        setDragX(dir === 'right' ? 500 : -500);
        setTimeout(() => { onSwipe(dir); setDragX(0); }, 260);
      }

      useEffect(() => {
        window.addEventListener('pointermove', pointerMove);
        window.addEventListener('pointerup', pointerUp);
        return () => {
          window.removeEventListener('pointermove', pointerMove);
          window.removeEventListener('pointerup', pointerUp);
        };
      });

      const visible = deck.slice(0, 2);

      return (
        <div style={{ maxWidth: 420, margin: '0 auto', padding: '40px 20px 60px', display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
          <h2 style={{ fontFamily: 'Sora, sans-serif', fontWeight: 700, fontSize: 24, color: '#223338', marginBottom: 28 }}>
            Quẹt để tìm đồng đội
          </h2>
          <div style={{ position: 'relative', width: '100%', height: 480 }}>
            {visible.length === 0 ? (
              <div style={{ position: 'absolute', inset: 0, background: '#fff', borderRadius: 28, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', boxShadow: '0 8px 20px rgba(34,51,56,0.08)' }}>
                <p style={{ fontSize: 16, color: '#6B8087', marginBottom: 16 }}>Bạn đã xem hết hồ sơ rồi!</p>
                <button onClick={onReset} style={{ background: '#3FA796', color: '#fff', border: 'none', padding: '10px 22px', borderRadius: 999, fontWeight: 700, cursor: 'pointer' }}>
                  Xem lại từ đầu
                </button>
              </div>
            ) : (
              visible.slice().reverse().map((p, i) => (
                <SwipeCard key={p.id} profile={p} isTop={i === visible.length - 1} dragX={i === visible.length - 1 ? dragX : 0} onPointerDown={pointerDown} />
              ))
            )}
          </div>
          {visible.length > 0 && (
            <div style={{ display: 'flex', gap: 28, marginTop: 32 }}>
              <button onClick={() => fireSwipe('left')} style={{ width: 60, height: 60, borderRadius: '9999px', background: '#fff', border: '2px solid #FBEAE8', color: '#E2574C', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', boxShadow: '0 6px 16px rgba(226,87,76,0.18)' }}>
                <X size={26} />
              </button>
              <button onClick={() => fireSwipe('right')} style={{ width: 60, height: 60, borderRadius: '9999px', background: '#3FA796', border: 'none', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', boxShadow: '0 6px 16px rgba(63,167,150,0.35)' }}>
                <Heart size={26} fill="#fff" />
              </button>
            </div>
          )}
        </div>
      );
    }

    function MatchModal({ profile, currentUser, onMessage, onContinue }) {
      return (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(20,32,35,0.55)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 50, padding: 20 }}>
          <div style={{ background: '#fff', borderRadius: 28, padding: '44px 32px 32px', maxWidth: 380, width: '100%', textAlign: 'center', position: 'relative', overflow: 'hidden' }}>
            <h2 style={{ fontFamily: 'Sora, sans-serif', fontWeight: 800, fontSize: 26, color: '#223338', margin: '0 0 24px' }}>It's a Match! 🎉</h2>
            <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 20 }}>
              <div style={{ marginRight: -20, zIndex: 1 }}><Avatar name={currentUser.name} color={currentUser.color} size={84} src={currentUser.avatarUrl} /></div>
              <div style={{ zIndex: 2 }}><Avatar name={profile.name} color={profile.color} size={84} /></div>
            </div>
            <p style={{ fontSize: 15, color: '#6B8087', marginBottom: 28 }}>
              Bạn và <strong style={{ color: '#223338' }}>{profile.name}</strong> đã ghép đội thành công cho "{profile.goal}"
            </p>
            <button onClick={onMessage} style={{ width: '100%', background: '#3FA796', color: '#fff', border: 'none', padding: '13px', borderRadius: 999, fontWeight: 700, fontSize: 15, cursor: 'pointer', marginBottom: 12 }}>
              Nhắn tin ngay
            </button>
            <button onClick={onContinue} style={{ width: '100%', background: 'transparent', color: '#223338', border: '2px solid #DCEAE6', padding: '11px', borderRadius: 999, fontWeight: 700, fontSize: 15, cursor: 'pointer' }}>
              Tiếp tục tìm kiếm
            </button>
          </div>
        </div>
      );
    }

    function ChatPage({ matches, currentUser, selectedId, setSelectedId }) {
      const [messages, setMessages] = useState([]);
      const [draft, setDraft] = useState('');
      const bottomRef = useRef(null);
      const selected = matches.find((m) => m.id === selectedId) || matches[0];

      useEffect(() => {
        if (!selectedId && matches.length) setSelectedId(matches[0].id);
      }, [matches, selectedId]);

      function send() {
        if (!draft.trim() || !selected) return;
        setMessages((prev) => [...prev, { id: Date.now(), sender_id: currentUser.id, content: draft.trim() }]);
        setDraft('');
      }

      if (matches.length === 0) {
        return (
          <div style={{ maxWidth: 480, margin: '0 auto', padding: '100px 24px', textAlign: 'center' }}>
            <MessageCircle size={40} color="#9AACAF" style={{ marginBottom: 16 }} />
            <p style={{ color: '#6B8087', fontSize: 15 }}>Bạn chưa ghép đội với ai. Quay lại trang Ghép đội để quẹt thử nhé!</p>
          </div>
        );
      }

      return (
        <div style={{ maxWidth: 900, margin: '0 auto', padding: '32px 20px 40px' }}>
          <div style={{ display: 'flex', background: '#fff', borderRadius: 24, overflow: 'hidden', boxShadow: '0 8px 24px rgba(34,51,56,0.08)', height: 560 }}>
            <div style={{ width: '30%', borderRight: '1px solid #EDF3F1', overflowY: 'auto' }}>
              {matches.map((m) => (
                <div key={m.id} onClick={() => setSelectedId(m.id)} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '14px 16px', cursor: 'pointer', background: selected?.id === m.id ? '#F4FAF8' : 'transparent', borderBottom: '1px solid #F4FAF8' }}>
                  <Avatar name={m.name} color={m.color} size={40} src={m.avatarUrl} />
                  <div style={{ minWidth: 0 }}>
                    <div style={{ fontSize: 14, fontWeight: 600, color: '#223338', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{m.name}</div>
                    <div style={{ fontSize: 12.5, color: '#9AACAF' }}>Trò chuyện ngay</div>
                  </div>
                </div>
              ))}
            </div>
            <div style={{ width: '70%', display: 'flex', flexDirection: 'column' }}>
              {selected && (
                <>
                  <div style={{ padding: '14px 20px', borderBottom: '1px solid #EDF3F1', display: 'flex', alignItems: 'center', gap: 10 }}>
                    <Avatar name={selected.name} color={selected.color} size={36} src={selected.avatarUrl} />
                    <div>
                      <div style={{ fontSize: 14.5, fontWeight: 700, color: '#223338' }}>{selected.name}</div>
                      <div style={{ fontSize: 12, color: '#3FA796' }}>Đang hoạt động</div>
                    </div>
                  </div>
                  <div style={{ flex: 1, overflowY: 'auto', padding: '20px', display: 'flex', flexDirection: 'column', gap: 10 }}>
                    {messages.length === 0 && <p style={{ textAlign: 'center', color: '#9AACAF', fontSize: 13.5 }}>Hãy bắt đầu cuộc trò chuyện!</p>}
                    {messages.map((m) => {
                      const isMe = m.sender_id === currentUser.id;
                      return (
                        <div key={m.id} style={{ alignSelf: isMe ? 'flex-end' : 'flex-start', background: isMe ? '#3FA796' : '#F1F5F4', color: isMe ? '#fff' : '#223338', padding: '10px 14px', borderRadius: 16, maxWidth: '70%', fontSize: 14 }}>
                          {m.content}
                        </div>
                      );
                    })}
                    <div ref={bottomRef} />
                  </div>
                  <div style={{ padding: 16, borderTop: '1px solid #EDF3F1', display: 'flex', gap: 10 }}>
                    <input value={draft} onChange={(e) => setDraft(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && send()} placeholder="Nhập tin nhắn..." style={{ flex: 1, border: '1px solid #DCEAE6', borderRadius: 999, padding: '11px 18px', fontSize: 14, outline: 'none' }} />
                    <button onClick={send} style={{ background: '#3FA796', border: 'none', color: '#fff', width: 42, height: 42, borderRadius: '9999px', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}>
                      <Send size={17} />
                    </button>
                  </div>
                </>
              )}
            </div>
          </div>
        </div>
      );
    }

    function ProfilePage({ currentUser, onSave }) {
      const [form, setForm] = useState({
        name: currentUser?.name || '',
        major: currentUser?.major || '',
        birthYear: currentUser?.birthYear || '2007',
        primarySkill: currentUser?.primarySkill || '',
        experience: currentUser?.experience || '',
        haveText: currentUser?.haveText || '',
        wantText: currentUser?.wantText || '',
        goal: currentUser?.goal || '',
      });

      return (
        <div style={{ maxWidth: 640, margin: '24px auto', padding: '0 16px 40px' }}>
          <div style={{ background: '#fff', borderRadius: 24, padding: 28, boxShadow: '0 8px 30px rgba(0,0,0,0.06)' }}>
            <h2 style={{ fontSize: 20, color: '#1B2A26', marginBottom: 20 }}>Thông tin cá nhân</h2>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
              <div>
                <label style={{ fontSize: 13, fontWeight: 600, color: '#6B8087', display: 'block', marginBottom: 6 }}>Họ và tên</label>
                <input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} style={{ width: '100%', border: '1px solid #DCEAE6', borderRadius: 14, padding: '12px 16px', fontSize: 14.5, outline: 'none' }} />
              </div>
              <div>
                <label style={{ fontSize: 13, fontWeight: 600, color: '#6B8087', display: 'block', marginBottom: 6 }}>Chuyên ngành</label>
                <input value={form.major} onChange={(e) => setForm({ ...form, major: e.target.value })} style={{ width: '100%', border: '1px solid #DCEAE6', borderRadius: 14, padding: '12px 16px', fontSize: 14.5, outline: 'none' }} />
              </div>
              <div>
                <label style={{ fontSize: 13, fontWeight: 600, color: '#6B8087', display: 'block', marginBottom: 6 }}>Kỹ năng đang có</label>
                <input value={form.haveText} onChange={(e) => setForm({ ...form, haveText: e.target.value })} placeholder="VD: Thiết kế, Figma, Python" style={{ width: '100%', border: '1px solid #DCEAE6', borderRadius: 14, padding: '12px 16px', fontSize: 14.5, outline: 'none' }} />
              </div>
              <div>
                <label style={{ fontSize: 13, fontWeight: 600, color: '#6B8087', display: 'block', marginBottom: 6 }}>Mục tiêu</label>
                <input value={form.goal} onChange={(e) => setForm({ ...form, goal: e.target.value })} placeholder="VD: Tìm đồng đội làm NCKH" style={{ width: '100%', border: '1px solid #DCEAE6', borderRadius: 14, padding: '12px 16px', fontSize: 14.5, outline: 'none' }} />
              </div>
              <button onClick={() => onSave(form)} style={{ width: '100%', background: '#3FA796', color: '#fff', border: 'none', padding: '13px', borderRadius: 999, fontWeight: 700, fontSize: 15, cursor: 'pointer', marginTop: 10 }}>
                Lưu thay đổi
              </button>
            </div>
          </div>
        </div>
      );
    }

    function AuthModal({ onClose, onAuth }) {
      const [tab, setTab] = useState('login');
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');

      return (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(20,32,35,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 50, padding: 20 }}>
          <div style={{ background: '#fff', borderRadius: 26, padding: '32px', maxWidth: 380, width: '100%', position: 'relative' }}>
            <button onClick={onClose} style={{ position: 'absolute', top: 18, right: 18, background: 'none', border: 'none', cursor: 'pointer', color: '#9AACAF' }}>
              <X size={20} />
            </button>
            <div style={{ display: 'flex', background: '#F4FAF8', borderRadius: 999, padding: 4, marginBottom: 24 }}>
              {['login', 'signup'].map((t) => (
                <button key={t} onClick={() => setTab(t)} style={{ flex: 1, border: 'none', padding: '9px 0', borderRadius: 999, fontWeight: 700, fontSize: 13.5, cursor: 'pointer', background: tab === t ? '#3FA796' : 'transparent', color: tab === t ? '#fff' : '#6B8087' }}>
                  {t === 'login' ? 'Đăng nhập' : 'Tạo tài khoản'}
                </button>
              ))}
            </div>
            {tab === 'signup' && (
              <input placeholder="Họ và tên" value={name} onChange={(e) => setName(e.target.value)} style={{ width: '100%', border: '1px solid #DCEAE6', borderRadius: 14, padding: '12px 16px', fontSize: 14.5, outline: 'none', marginBottom: 12 }} />
            )}
            <input placeholder="Email sinh viên" value={email} onChange={(e) => setEmail(e.target.value)} style={{ width: '100%', border: '1px solid #DCEAE6', borderRadius: 14, padding: '12px 16px', fontSize: 14.5, outline: 'none', marginBottom: 12 }} />
            <input placeholder="Mật khẩu" type="password" value={password} onChange={(e) => setPassword(e.target.value)} style={{ width: '100%', border: '1px solid #DCEAE6', borderRadius: 14, padding: '12px 16px', fontSize: 14.5, outline: 'none', marginBottom: 16 }} />
            <button onClick={() => onAuth({ name, email, password, isSignUp: tab === 'signup' })} style={{ width: '100%', background: '#3FA796', color: '#fff', border: 'none', padding: '13px', borderRadius: 999, fontWeight: 700, fontSize: 15, cursor: 'pointer' }}>
              {tab === 'login' ? 'Vào ghép đội' : 'Đăng ký ngay'}
            </button>
          </div>
        </div>
      );
    }

    function App() {
      const [page, setPage] = useState('landing');
      const [showAuth, setShowAuth] = useState(false);
      const [isLoggedIn, setIsLoggedIn] = useState(true);
      const [currentUser, setCurrentUser] = useState({
        id: 'me',
        name: 'Bạn',
        major: 'Kinh tế / Kinh doanh',
        haveText: 'Thuyết trình, Làm việc nhóm',
        wantText: 'Lập trình, Thiết kế',
        goal: 'Tìm đồng đội nghiên cứu',
        color: '#5B8DEF',
        avatarUrl: null,
      });
      const [deck, setDeck] = useState(PROFILES);
      const [matches, setMatches] = useState([PROFILES[0], PROFILES[1]]);
      const [pendingMatch, setPendingMatch] = useState(null);
      const [selectedChatId, setSelectedChatId] = useState(PROFILES[0].id);

      function handleSwipe(dir) {
        const top = deck[0];
        setDeck((d) => d.slice(1));
        if (dir === 'right') {
          if (!matches.find((m) => m.id === top.id)) {
            setPendingMatch(top);
          }
        }
      }

      function confirmMatch(goToChat) {
        if (!pendingMatch) return;
        setMatches((m) => [...m, pendingMatch]);
        if (goToChat) {
          setSelectedChatId(pendingMatch.id);
          setPage('chat');
        }
        setPendingMatch(null);
      }

      return (
        <div style={{ minHeight: '100vh', background: '#F4FAF8' }}>
          <Header page={page} setPage={setPage} isLoggedIn={isLoggedIn} currentUser={currentUser} onLogout={() => setIsLoggedIn(false)} onLoginClick={() => setShowAuth(true)} />
          {page === 'landing' && <Landing onCtaClick={() => setPage('swipe')} />}
          {page === 'swipe' && <SwipePage deck={deck} onSwipe={handleSwipe} onReset={() => setDeck(PROFILES)} />}
          {page === 'chat' && <ChatPage matches={matches} currentUser={currentUser} selectedId={selectedChatId} setSelectedId={setSelectedChatId} />}
          {page === 'profile' && <ProfilePage currentUser={currentUser} onSave={(data) => { setCurrentUser({ ...currentUser, ...data }); alert('Đã lưu thông tin!'); }} />}
          {showAuth && <AuthModal onClose={() => setShowAuth(false)} onAuth={(d) => { setIsLoggedIn(true); setShowAuth(false); }} />}
          {pendingMatch && <MatchModal profile={pendingMatch} currentUser={currentUser} onMessage={() => confirmMatch(true)} onContinue={() => confirmMatch(false)} />}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
